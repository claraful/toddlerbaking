<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one step per screen. Big picture tiles with big numbers, an action badge, an arrow to the result, small grown-up notes, and a thick bottom button bar. */
:root{
  --bg:#E6F3FF;
  --card:#FFFFFF;
  --ink:#3B2A1A;
  --muted:#6B5A4A;
  --outline:#3B2A1A;
  --accent:#FFD93B;
  --accent-ink:#3B2A1A;
  --tile:#FFFFFF;
  --tile-ink:#3B2A1A;
  --tile-muted:#6B5A4A;
  --good-bg:#DDF5D9;
  --good-ink:#1F5A1A;
  --warn-bg:#FFEBC2;
  --warn-ink:#6A430C;
  --dot:#B9CFE3;
  --dot-on:#3B2A1A;
  --font-display:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141E29;--card:#1E2B3A;--ink:#F6EEE4;--muted:#C2B5A6;--outline:#0C1219;
    --tile:#FFF8EC;--good-bg:#1F3A22;--good-ink:#BFE8B8;--warn-bg:#40300F;--warn-ink:#FFDFA3;
    --dot:#3A4D61;--dot-on:#FFD93B;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141E29;--card:#1E2B3A;--ink:#F6EEE4;--muted:#C2B5A6;--outline:#0C1219;
  --tile:#FFF8EC;--good-bg:#1F3A22;--good-ink:#BFE8B8;--warn-bg:#40300F;--warn-ink:#FFDFA3;
  --dot:#3A4D61;--dot-on:#FFD93B;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:600;font-size:17px;line-height:1.45;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 8px}
h1{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.15;margin:0;text-align:center;text-wrap:balance}
.sub{margin:6px 0 0;text-align:center;color:var(--muted);font-size:15px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tab{font-family:var(--font-display);font-weight:600;font-size:19px;padding:10px 22px;border:3px solid var(--outline);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--outline)}
.tab:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.dots{display:flex;gap:7px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--dot)}
.dots span.on{background:var(--dot-on);transform:scale(1.25)}
.dots span.done{background:var(--accent);box-shadow:inset 0 0 0 2px var(--outline)}
.count{text-align:center;color:var(--muted);font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:0 0 14px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{background:var(--tile);border:3px solid var(--outline);border-radius:22px;box-shadow:0 4px 0 var(--outline);padding:12px 14px 10px;min-width:124px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .row{display:flex;gap:2px}
.pic svg{width:100%;height:100%;display:block}
.num{font-family:var(--font-display);font-weight:600;font-size:56px;line-height:1.05;color:var(--tile-ink)}
.unit{font-size:15px;font-weight:800;color:var(--tile-muted);text-align:center;min-height:1.3em}
.action{display:flex;align-items:center;gap:14px}
.badge{width:68px;height:68px;border-radius:50%;background:var(--accent);border:3px solid var(--outline);box-shadow:0 4px 0 var(--outline);display:grid;place-items:center;color:var(--accent-ink)}
.badge svg,.down svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.word{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.1}
.down{color:var(--muted)}
.down svg{width:44px;height:44px;stroke-width:2.6}
.out{width:156px;height:156px;background:var(--tile);border:3px solid var(--outline);border-radius:30px;box-shadow:0 4px 0 var(--outline);padding:8px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:22px}
.note{border-radius:16px;padding:12px 14px;min-width:0}
.note b{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note p{margin:0;font-size:16px}
.kid{background:var(--good-bg);color:var(--good-ink)}
.adult{background:var(--warn-bg);color:var(--warn-ink)}

.bar button{font-family:var(--font-display);font-weight:600;font-size:26px;border:3px solid var(--outline);border-radius:20px;height:68px;cursor:pointer;color:var(--accent-ink)}
.bar button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#back{flex:0 0 auto;padding-inline:22px;background:var(--card);color:var(--ink)}
#next{flex:1;background:var(--accent);box-shadow:0 4px 0 var(--outline)}
#next:active{transform:translateY(3px);box-shadow:0 1px 0 var(--outline)}
.pantry{margin-top:22px}
.lead{margin:0 0 4px;text-align:center;color:var(--muted);font-size:16px}
.group{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.2;margin:22px 0 10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--outline);border-radius:18px;padding:8px 14px 8px 10px;cursor:pointer;min-width:0}
.item input{flex:none;width:26px;height:26px;accent-color:var(--dot-on);cursor:pointer}
.thumb{flex:none;width:60px;height:60px;background:var(--tile);border-radius:14px;padding:3px}
.what{min-width:0}
.amt{display:block;font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.15}
.name{display:block;font-size:16px}
.what small{display:block;color:var(--muted);font-size:13px;font-weight:800}
.item.done .what{text-decoration:line-through;text-decoration-thickness:2px}
.item.done .thumb{opacity:.45}
.equip{margin-top:22px}
.starts{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;padding-bottom:20px}
.start{flex:1 1 200px;font-family:var(--font-display);font-weight:600;font-size:22px;height:62px;border:3px solid var(--outline);border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--outline);cursor:pointer}
.start.alt{background:var(--card);color:var(--ink)}
.start:focus-visible,.item input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.stage.pop{animation:none}}
@media (max-width:420px){.num{font-size:50px}.word{font-size:30px}h1{font-size:25px}}
</style>

</head>

</nav>
